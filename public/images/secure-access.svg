<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0F292E"/>
      <stop offset="100%" stop-color="#091E22"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- Shield Inner Gradient -->
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#0F766E" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <rect width="600" height="400" fill="url(#gridPattern)"/>

  <!-- Radial Ambient Light -->
  <circle cx="300" cy="200" r="180" fill="#0F766E" opacity="0.15" filter="url(#glow)"/>

  <!-- Geometric Circuit Lines -->
  <g stroke="#14B8A6" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M 100 120 L 180 120 L 220 160"/>
    <circle cx="100" cy="120" r="3.5" fill="#14B8A6"/>
    <path d="M 500 120 L 420 120 L 380 160"/>
    <circle cx="500" cy="120" r="3.5" fill="#14B8A6"/>
    <path d="M 120 280 L 200 280 L 240 240"/>
    <circle cx="120" cy="280" r="3.5" fill="#14B8A6"/>
    <path d="M 480 280 L 400 280 L 360 240"/>
    <circle cx="480" cy="280" r="3.5" fill="#14B8A6"/>
  </g>

  <!-- Outer Shield Aura -->
  <path d="M 300 70 
           C 365 70, 420 85, 420 135 
           C 420 235, 300 325, 300 325 
           C 300 325, 180 235, 180 135 
           C 180 85, 235 70, 300 70 Z" 
        fill="none" stroke="#2DD4BF" stroke-width="2" opacity="0.5" filter="url(#softGlow)"/>

  <!-- Main Shield Body -->
  <path d="M 300 80 
           C 355 80, 405 92, 405 140 
           C 405 228, 300 310, 300 310 
           C 300 310, 195 228, 195 140 
           C 195 92, 245 80, 300 80 Z" 
        fill="url(#innerShield)" stroke="url(#shieldGrad)" stroke-width="4"/>

  <!-- Inner Concentric Shield Ring -->
  <path d="M 300 100 
           C 340 100, 380 110, 380 148 
           C 380 215, 300 282, 300 282 
           C 300 282, 220 215, 220 148 
           C 220 110, 260 100, 300 100 Z" 
        fill="none" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8"/>

  <!-- Central Lock Symbol -->
  <g transform="translate(300, 190)">
    <!-- Lock Shackle -->
    <path d="M -22 -10 
             L -22 -28 
             C -22 -44, 22 -44, 22 -28 
             L 22 -10" 
          fill="none" stroke="#5EEAD4" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Lock Body -->
    <rect x="-35" y="-12" width="70" height="56" rx="14" fill="#0F766E" stroke="#5EEAD4" stroke-width="2.5"/>
    
    <!-- Keyhole -->
    <circle cx="0" cy="10" r="7" fill="#0F172A"/>
    <path d="M -3.5 12 L 3.5 12 L 5 26 L -5 26 Z" fill="#0F172A"/>
  </g>

  <!-- Floating Security Badges -->
  <!-- Top Left Badge: Argon2 -->
  <g transform="translate(130, 95)">
    <rect width="115" height="30" rx="8" fill="#1E293B" stroke="#0F766E" stroke-width="1.2" opacity="0.95"/>
    <circle cx="16" cy="15" r="4.5" fill="#10B981"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Argon2id Hash</text>
  </g>

  <!-- Bottom Right Badge: HttpOnly Session -->
  <g transform="translate(365, 275)">
    <rect width="125" height="30" rx="8" fill="#1E293B" stroke="#0F766E" stroke-width="1.2" opacity="0.95"/>
    <circle cx="16" cy="15" r="4.5" fill="#10B981"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">HttpOnly Cookie</text>
  </g>

  <!-- Bottom Left Badge: Tenant Guard -->
  <g transform="translate(110, 275)">
    <rect width="125" height="30" rx="8" fill="#1E293B" stroke="#0F766E" stroke-width="1.2" opacity="0.95"/>
    <circle cx="16" cy="15" r="4.5" fill="#38BDF8"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Tenant Isolation</text>
  </g>
</svg>
